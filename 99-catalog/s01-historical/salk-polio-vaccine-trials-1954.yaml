possible_analytical_questions:
  - How do observed and randomized control designs change the interpretation of the outcome counts?
  - Which outcome definitions and denominators must be made explicit before comparing groups?

curricular_signal:
  analytics_capabilities:
    - Assess evidence in relation to the data-generating and comparison design.
    - Interpret summarized outcomes before supporting a public-health decision.
  contributing_disciplines:
    - Statistics: supports experimental-design reasoning within an Analytics decision context.
  cautions:
    - The available table is highly aggregated and does not support participant-level analysis.
    - Historical clinical-trial norms and terminology require contextual treatment.

