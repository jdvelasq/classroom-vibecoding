possible_analytical_questions:
  - What patterns do district mortality rates show relative to the recorded predictors?
  - Which causal claims are unsupported by these aggregated observational data?

curricular_signal:
  analytics_capabilities:
    - Compare competing explanations against documented evidence.
    - Separate descriptive association from causal and policy claims.
  contributing_disciplines:
    - Statistics: supports cautious comparison and modelling in service of the public-health question.
  cautions:
    - The ecological data cannot identify individual exposure or prove a mechanism.
    - The case should preserve the historical revision of Farr's explanation rather than judge it only retrospectively.

