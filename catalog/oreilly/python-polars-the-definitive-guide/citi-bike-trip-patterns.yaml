possible_analytical_questions:
  - Which boroughs and stations have the highest trip volumes, and how does that vary by day?
  - How do departures and arrivals reveal possible spatial imbalances in bike-share demand?
  - Which quality checks are needed before aggregating trip time and station fields?
limitations:
  - The companion subset covers March 2024 only; seasonal or long-run conclusions require additional official trip-history files.
  - Data are anonymized trip records and do not establish rider-level behavior or causal explanations.
  - Citi Bike terms allow analysis but restrict distribution of the raw data as a stand-alone dataset.
curricular_signal:
  analytics_capabilities:
    - Produce defensible descriptive and geospatial summaries for an urban-service operation.
    - Translate station-level evidence into questions about demand balance and service operations.
  contributing_disciplines:
    - "Data Engineering: contributes efficient file ingestion and transformation."
    - "Statistics: contributes aggregation and uncertainty-aware interpretation."
  cautions:
    - Do not characterize correlations in trip patterns as causes without an appropriate design.
    - Direct learners to retrieve data from Citi Bike rather than redistribute the companion subset.
