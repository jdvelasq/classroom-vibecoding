  problem:
    context: 'A telecommunications provider can offer retention incentives to customers
      predicted to churn, but contacting every high-risk customer may destroy value
      when incentives are costly, some customers would stay anyway, and customer lifetime
      values differ.

'
    objective: 'Convert churn predictions into an economically defensible targeting
      policy using expected value rather than classification accuracy alone.

'
    analytical_questions:
    - Which customers should receive a retention incentive?
    - How should customer value alter the targeting decision?
    - What is the cost of giving incentives to customers who would stay anyway?
    - How does treatment effectiveness change the optimal targeting threshold?
    - How should a predictive model be evaluated in business-value terms?
