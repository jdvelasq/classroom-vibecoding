historical_context: >
  This is a contemporary public-data case, not a historical case. The record uses
  the shared case schema so that its NCHS/CDC provenance and use restrictions remain
  comparable with other catalog cases.

case:
  decision_or_problem: >
    How can public natality records be prepared and analyzed to describe or estimate
    birth outcomes while respecting data-use restrictions, sensitive health context,
    and the difference between prediction and clinical decision-making?
  analytical_relevance: >
    The case links source documentation, missing and sentinel values, outcome
    definition, model evaluation, and ethical limits on using predictive health data.

datasets:
  - name: National Vital Statistics System public-use birth data files
    relationship_to_case: The book companion uses a prepared sample of CDC/NCHS natality records for neonatal-risk and birth-weight modelling.
    source_url: https://www.cdc.gov/nchs/data_access/VitalStatsOnline.htm
    provider: National Center for Health Statistics, Centers for Disease Control and Prevention
    access_method: Downloadable public-use birth data files and accompanying user guides
    availability: public with use restrictions
    license_or_terms: >
      NCHS public-use data may be used only for statistical analysis or reporting,
      subject to the NCHS Data User Agreement and confidentiality restrictions; do not
      attempt to identify individuals or use restricted versions without approval.
    access_date: 2026-09-29
    contents: >
      Public-use birth records and documentation. The book companion's prepared sample
      includes maternal, prenatal, gestational, obstetric, birth-weight, and Apgar
      variables. Public files suppress or limit identifying geographic and date detail;
      variables and coding vary by year.

