possible_analytical_questions:
  - Which data-quality and coding decisions materially affect a defined birth-outcome analysis?
  - What evidence and safeguards are needed before interpreting a risk or birth-weight prediction?

curricular_signal:
  analytics_capabilities:
    - Prepare sensitive public-use data reproducibly while retaining source and use constraints.
    - Evaluate predictive outputs within their intended scope and communicate their limits.
  contributing_disciplines:
    - Machine Learning: supplies bounded predictive methods in service of the health-data Analytics question.
  cautions:
    - This is not a clinical decision-support system or a basis for individual treatment decisions.
    - NCHS terms, confidentiality limits, missingness, coding changes, and outcome inequities require explicit treatment.

