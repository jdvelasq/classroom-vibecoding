historical_context: >
  This is a contemporary public-data case, not a historical case. The record uses
  the shared case schema so that its Census PUMS provenance and limitations remain
  comparable with other catalog cases.

case:
  decision_or_problem: >
    How can a defined public-use population be used to estimate and communicate
    variation in personal income from recorded demographic, education, and
    employment characteristics, without turning estimates into individual judgments?
  analytical_relevance: >
    The case connects population sampling, data preparation, modelling, evaluation,
    interpretation, and responsible communication for a consequential socioeconomic outcome.

datasets:
  - name: American Community Survey Public Use Microdata Sample (PUMS)
    relationship_to_case: The book companion derives a working-age, full-time employee sample from Census PUMS data for income modelling.
    source_url: https://www.census.gov/programs-surveys/acs/microdata.html
    provider: U.S. Census Bureau
    access_method: Public files through data.census.gov or the Census FTP site
    availability: public
    license_or_terms: >
      Census identifies these as public-use microdata files, available free of charge,
      with disclosure protection; use and any redistribution decision must retain the
      applicable Census documentation and confidentiality context.
    access_date: 2026-09-29
    contents: >
      Individual and housing-unit sample records with disclosure protection. The book
      example uses a prepared subset with income, age, sex, education, and class of
      worker. It is a sample rather than a complete population and its geography is
      intentionally limited by public-use disclosure protection.

