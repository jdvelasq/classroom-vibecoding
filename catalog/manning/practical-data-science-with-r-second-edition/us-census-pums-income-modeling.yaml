possible_analytical_questions:
  - Which sample-definition and transformation choices materially affect an income model?
  - How should predicted income and error be communicated without inferring individual worth or causation?

curricular_signal:
  analytics_capabilities:
    - Define a population and assess the fitness and limits of a public-use sample.
    - Evaluate and communicate model outputs for a socioeconomic outcome responsibly.
  contributing_disciplines:
    - Statistics: supports sampling and uncertainty reasoning in service of the Analytics problem.
  cautions:
    - Income is sensitive; predictions should not be framed as individual valuation or causal explanation.
    - Public-use disclosure protection, sampling, and restricted geography limit interpretation.

