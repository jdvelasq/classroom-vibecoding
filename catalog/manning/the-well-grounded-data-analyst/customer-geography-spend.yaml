case:
  decision_or_problem: >
    How should customer-address data be cleaned and interpreted to compare
    customer spending in London with spending in the rest of the United Kingdom?
  analytical_relevance: >
    The case connects unstructured address cleaning, geographic encoding,
    aggregation, and cautious interpretation of a location-based comparison.
  scope: Book-curated customer-address reconstruction; not evidence about a named real company.

