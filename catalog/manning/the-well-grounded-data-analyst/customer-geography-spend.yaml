possible_analytical_questions:
  - Which address patterns prevent reliable city extraction?
  - How does total customer spend differ between London and other UK cities?
  - Which geographic assumptions materially change the comparison?

limitations:
  - The data are book-curated and are not evidence about a named real company.
  - Address text alone can create ambiguous or false city classifications.

curricular_signal:
  analytics_capabilities:
    - Convert unstructured address data into a defensible geographic analysis variable.
    - Aggregate customer value while stating geographic-classification limits.
  contributing_disciplines:
