possible_analytical_questions:
  - Which simulated usage, account, and billing signals precede churn in a defined observation window?
  - How can a retention analysis avoid using information unavailable at the decision date?
  - What changes when the unit of analysis is an account rather than an individual user?
  - How should conclusions from simulated churn data be bounded before a decision is proposed?

curricular_signal:
  analytics_capabilities:
    - Define a retention question, decision point, and analysis population.
    - Inspect customer-event, account, and billing data for temporal and grain issues.
    - Communicate the difference between a reproducible simulation and operational evidence.
  contributing_disciplines:
    - Statistics: contributes uncertainty-aware evaluation of retention signals.
    - Data Engineering: contributes reproducible generation and relational loading of the data.
  cautions:
    - The data are simulated and must not be represented as observations from a real business.
    - CRM5 may be impractical for routine classroom infrastructure because its documented output can be large.
    - A repository license does not grant rights to any separately sourced real customer data.

