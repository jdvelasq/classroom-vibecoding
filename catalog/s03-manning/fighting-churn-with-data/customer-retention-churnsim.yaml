  companion_sources:
    - title: Carl Gold's fight-churn companion repository
      url: https://github.com/carl24k/fight-churn
      relationship: >
        Linked as source code from the Manning book page; its README identifies
        it as the code for Fighting Churn with Data.
  access_date: 2026-09-29

case:
  decision_or_problem: >
    How can a subscription business use customer behavior, account, billing,
    and product-use histories to understand retention risk and evaluate churn
    interventions without claiming that a synthetic simulation represents a
    particular real company?
  analytical_relevance: >
    The documented ChurnSim generator supplies a reproducible, book-specific
    reconstruction for investigating customer retention, behavioral signals,
    temporal leakage, and the operational implications of churn analysis.
  scope: >
    A book-curated synthetic simulation. It is suitable for reproducible
    analytical practice, not for factual inference about an actual business or
    customer population.

datasets:
  - name: ChurnSim simulated customer-retention data
    relationship_to_case: >
      The book companion generates the customer, account, activity, and churn
      data used to run its retention-analysis code; the documented CRM5 option
      adds a more detailed CRM-product simulation.
    source_url: https://github.com/carl24k/fight-churn
    provider: Carl S. Gold's documented companion repository for the Manning book
    access_method: >
      Run the public ChurnSim generator following the repository setup
      instructions; the generated output is loaded into PostgreSQL.
    availability: public, generated locally from the companion repository
    license_or_terms: >
      The companion repository is distributed under the MIT License. The data
      are simulated outputs of that repository, not an externally licensed
      real-world dataset.
    access_date: 2026-09-29
    contents: >
      Simulated customer-retention data. The documented CRM5 configuration
      includes product plans, multi-user customer accounts, multiple billing
      periods, and valued actions; the repository warns that a full CRM5 run
      can produce roughly 30 GB in PostgreSQL.

