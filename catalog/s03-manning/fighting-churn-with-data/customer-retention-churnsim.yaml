id: manning/fighting-churn-with-data/customer-retention-churnsim
name: Customer retention analysis with ChurnSim
aliases:
  - Fighting Churn with Data
  - ChurnSim customer churn simulation
  - CRM5 churn simulation
type: book_curated_case

book_source:
  publisher: Manning
  title: Fighting Churn with Data
  edition: null
