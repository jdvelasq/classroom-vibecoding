case:
  decision_or_problem: >
    How can an organization construct a defensible customer-level analytical
    table when purchases, CRM exports, and customer-database records overlap,
    omit identifiers, and contain duplicate or inconsistent identities?
  analytical_relevance: >
    The case makes data integration, entity resolution, source lineage,
    duplicate handling, and uncertainty visible before downstream customer
    analysis or decision-making.
  scope: >
    A book-curated business-data reconstruction. It must not be represented as
    evidence about a named real organization or its customers.

datasets:
  - name: Chapter 3 customer-integration dataset bundle
    relationship_to_case: >
      The project combines purchases.csv, crm_export.csv, and
      customer_database.csv to infer one customer entity per row and identify
      duplicate records.
    source_url: https://github.com/davidasboth/the-well-grounded-data-analyst/tree/main/chapter-3/data
    provider: David Asboth's documented companion repository for the Manning book
    access_method: Public repository files accompanying the project notebook
    availability: public
    license_or_terms: >
      The companion repository is distributed under an MIT License. The
      repository does not establish an external origin for each record, so this
      bundle is recorded as a book-curated reconstruction rather than as a
      verified real-world customer dataset.
    access_date: 2026-09-29
    contents: >
      Purchase transactions with product, session, customer, and guest-checkout
      fields; CRM records; and customer-database records. The notebook shows
      names, postcodes, ages, customer identifiers, incomplete records, and
      duplicate identity patterns.

