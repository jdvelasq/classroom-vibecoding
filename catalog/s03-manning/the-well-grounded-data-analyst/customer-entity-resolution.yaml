possible_analytical_questions:
  - Which identifiers and attributes can link records across purchases, CRM, and customer databases?
  - How do missing identifiers, guest checkouts, typos, and repeated attributes affect entity resolution?
  - Which matching rules require review rather than automatic merging?
  - How should source lineage and unresolved ambiguity be retained in a customer-level table?

curricular_signal:
  analytics_capabilities:
    - Build an analysis-ready entity table from inconsistent operational sources.
    - Evaluate deterministic and similarity-based matching assumptions.
    - Preserve source lineage and communicate matching uncertainty before use.
  contributing_disciplines:
    - Databases: contributes entity and schema integration techniques.
    - Statistics: contributes uncertainty-aware assessment of linkage rules.
  cautions:
    - The record bundle is book-curated; do not claim that it describes a real organization.
    - Treat customer-like fields as potentially sensitive in any classroom adaptation.
    - A repository license is not evidence of an external data provider or a real-data use right.

