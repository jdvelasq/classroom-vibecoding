possible_analytical_questions:
  - How are cases distributed relative to the mapped water pumps?
  - What additional evidence is needed before moving from spatial association to a public-health recommendation?

curricular_signal:
  analytics_capabilities:
    - Combine spatial evidence with contextual and stakeholder information.
    - Distinguish association, interpretation, and action under uncertainty.
  contributing_disciplines:
    - Spatial analysis: supports location-based evidence assessment in service of the public-health problem.
  cautions:
    - Historical accounts differ on details of the pump-handle action and timing.
    - The reconstructed map data omit much of the population at risk, exposure behavior, and case chronology.

